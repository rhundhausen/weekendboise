baseURL = '/'
locale = 'en-us'
title = 'WeekendBoise'
disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

# The site is built with the shared engine (github.com/rhundhausen/weekend) as its Hugo theme; see
# its website/build.sh. Files here at the same path as the engine's replace them: static/ holds this
# city's icons and web manifest, and assets/css/skyline.css (when present) its skyline.
[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  # Events come from the repo-level data/ folder, so ingestion never writes into this tree.
  [[module.mounts]]
    source = '../data'
    target = 'data'
    # The raw file is ingest's input for refine, and city-lookup.json is refine's memory of the
    # pages it read; the site reads neither.
    files = ['! raw-events.json', '! city-lookup.json']
  # The source list, for the sources page and the header count.
  [[module.mounts]]
    source = '../ingestion/sources.json'
    target = 'data/sources.json'
  # The city's facts: name, time zone, coordinates, About page text.
  [[module.mounts]]
    source = '../city.json'
    target = 'data/city.json'

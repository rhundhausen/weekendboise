name: ingest-additional
on:
  schedule:
    - cron: "0 9 * * *" # ~2-3 AM Boise time
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python additional/ingest.py
        env:
          INGEST_ADDITIONAL_URLS: ${{ secrets.INGEST_ADDITIONAL_URLS }}
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.json

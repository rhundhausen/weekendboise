name: ingest-additional
on:
  schedule:
    - cron: "0 9 * * *" # ~2-3 AM Boise time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Test additional ingest
        run: python -m unittest discover -s additional -p 'test_*.py'
      - run: python additional/ingest.py
        env:
          INGEST_ADDITIONAL_URLS: |
            ${{ secrets.INGEST_ADDITIONAL_URLS }}
            https://estatesales.org/estate-sales/id/boise?sort=distance&radius=100&view=list
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events-additional.json
          git diff --cached --quiet && exit 0
          git commit -m "Update events-additional.json"
          git pull --rebase -q
          git push

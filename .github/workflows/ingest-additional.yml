name: ingest-additional
on:
  # 23:30 in Boise is 05:30 UTC during daylight time and 06:30 UTC during standard time.
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: ingestion/scripts/Test-BoiseHour.ps1
          sparse-checkout-cone-mode: false
      - name: Check Boise time
        id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: pwsh
        run: ./ingestion/scripts/Test-BoiseHour.ps1 -Hour 23

  run:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Test additional ingest
        run: python -m unittest discover -s additional -p 'test_*.py'
      - run: python additional/ingest.py
        env:
          INGEST_ADDITIONAL_URLS: |
            ${{ secrets.INGEST_ADDITIONAL_URLS }}
            https://estatesales.org/estate-sales/id/boise?sort=distance&radius=100&view=list
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events-additional.json
          git diff --cached --quiet && exit 0
          git commit -m "Update events-additional.json"
          git pull --rebase -q
          git push

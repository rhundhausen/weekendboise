# Checks this city's files (city.json, sources.json, stored events) and builds the site, with the
# shared core's reusable workflow (github.com/rhundhausen/weekend, .github/workflows/city-test.yml),
# on every push and pull request, or by hand. The core's own tests run in its repo.

name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: rhundhausen/weekend/.github/workflows/city-test.yml@main

# Nightly ingest, stage 1 of 2: fetches every running source into data/raw-events.json and commits
# it. The work is the shared code's reusable workflow (github.com/rhundhausen/weekend,
# .github/workflows/ingest.yml); this file holds only the schedule and the secrets. When the
# scheduled run finishes, whether it succeeded or not, refine starts. A manual run does not start
# refine.

name: ingest

on:
  # Cron is UTC and Boise is UTC-6 in summer and UTC-7 in winter, so both hours are scheduled
  # and the core skips the one that isn't midnight in the city's time zone (city.json).
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Run only this source. Leave blank for all.
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

# Shared with refine, so the two never run at once. A manual refine waits for a running ingest.
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  nightly:
    uses: rhundhausen/weekend/.github/workflows/ingest.yml@main
    with:
      source: ${{ inputs.source || '' }}
      hour: 0
    secrets: inherit

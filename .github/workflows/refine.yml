# Nightly refine, stage 2 of 2. Reads the committed data/raw-events.json, merges and cleans it,
# checks event links, and commits the files the site reads, which deploys the site. Starts when an
# ingest run finishes, whether it succeeded or not, or by hand as often as needed. It never fetches
# a source.

name: refine

on:
  # Every completed ingest run on main, scheduled or manual. The when job skips the runs whose
  # ingest job never started (the cron line that isn't midnight in Boise).
  workflow_run:
    workflows: [ingest]
    types: [completed]
    branches: [main]
  # A raw file pushed from a PC by Invoke-LocalIngest.ps1. The nightly ingest's own push never
  # starts this, because pushes made with a workflow's GITHUB_TOKEN start no workflows.
  push:
    branches: [main]
    paths: [data/raw-events.json]
  workflow_dispatch:
    inputs:
      skip_link_check:
        description: Skip the link check (known link results still apply).
        type: boolean
        required: false
        default: false
      skip_city_lookup:
        description: Skip the city lookup for Other events (known cities still apply).
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # To read the ingest run's jobs in the when job.
  actions: read

# Shared with ingest, so the two never run at once. A manual refine waits for a running ingest.
concurrency:
  group: data
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  when:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: ingestion/scripts/Test-IngestRan.ps1
          sparse-checkout-cone-mode: false

      # A manual run always goes ahead. After ingest, refine goes ahead if ingest's job started,
      # whatever its outcome, so a failed ingest still moves past events and checks links.
      - name: Check the ingest run
        id: check
        env:
          EVENT: ${{ github.event_name }}
          INGEST_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: ./ingestion/scripts/Test-IngestRan.ps1

  refine:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The link check stops itself after 15 minutes and the city lookup after 3; the rest takes
    # under a minute.
    timeout-minutes: 30
    steps:
      # The head of main, so it reads the raw file ingest just committed.
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # No API key secrets: refine requests only event pages and robots.txt, never a source API.
      # The input goes through env, not inline, so its text is never parsed as script.
      - name: Refine
        env:
          SKIP_LINK_CHECK: ${{ inputs.skip_link_check }}
          SKIP_CITY_LOOKUP: ${{ inputs.skip_city_lookup }}
        run: |
          $options = @{}
          if ($env:SKIP_LINK_CHECK -eq 'true') { $options.SkipLinkCheck = $true }
          if ($env:SKIP_CITY_LOOKUP -eq 'true') { $options.SkipCityLookup = $true }
          ./ingestion/scripts/Invoke-Refine.ps1 @options

      - name: Upload refine output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refine-out
          path: out
          if-no-files-found: ignore

      - name: Commit data
        run: |
          $paths = 'data/events.json', 'data/archive', 'data/links.json', 'data/city-lookup.json', 'data/meta.json'
          ./ingestion/scripts/Publish-Data.ps1 -Path $paths -Message 'data: nightly refine'

  # The summary email, in its own job because GitHub serves a job's log only once that job has
  # finished, and the email attaches the refine job's log. Runs whatever refine's outcome, so a
  # failed run is emailed too. These are the only secrets refine's workflow is given.
  report:
    needs: [when, refine]
    if: always() && needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download refine output
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: refine-out
          path: out

      # Never blocks the email: without logs, the email says so.
      - name: Save the job logs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: ./ingestion/scripts/Save-RunLogs.ps1

      - name: Email the report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          JOB_STATUS: ${{ needs.refine.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: ./ingestion/scripts/Send-Report.ps1 -Kind refine

# Nightly refine, stage 2 of 2: turns data/raw-events.json into the files the site reads and
# commits them, which deploys the site. The work is the shared core's reusable workflow
# (github.com/rhundhausen/weekend, .github/workflows/refine.yml); this file holds only the triggers.

name: refine

on:
  # Every completed ingest run on main, scheduled or manual. The core skips the runs whose ingest
  # job never started (the cron line that isn't midnight in the city).
  workflow_run:
    workflows: [ingest]
    types: [completed]
    branches: [main]
  # A raw file pushed from a PC by the core's Invoke-LocalIngest.ps1. The nightly ingest's own
  # push never starts this, because pushes made with a workflow's GITHUB_TOKEN start no workflows.
  push:
    branches: [main]
    paths: [data/raw-events.json]
  workflow_dispatch:
    inputs:
      skip_link_check:
        description: Skip the link check (known link results still apply).
        type: boolean
        required: false
        default: false
      skip_city_lookup:
        description: Skip the city lookup for Other events (known cities still apply).
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

# Shared with ingest, so the two never run at once. A manual refine waits for a running ingest.
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  nightly:
    uses: rhundhausen/weekend/.github/workflows/refine.yml@main
    with:
      skip_link_check: ${{ inputs.skip_link_check || false }}
      skip_city_lookup: ${{ inputs.skip_city_lookup || false }}
    secrets: inherit

# Nightly refine, stage 2 of 2: turns data/raw-events.json into the files the site reads and
# commits them, which deploys the site. The work is the shared code's reusable workflow
# (github.com/rhundhausen/weekend, .github/workflows/refine.yml); this file holds only the triggers: after the scheduled ingest, or by hand.

name: refine

on:
  # Right after the scheduled midnight ingest (the job below skips manual ingest runs). The core
  # also skips the run whose ingest job never started (the cron line that isn't midnight in the
  # city). Nothing starts refine on a push.
  workflow_run:
    workflows: [ingest]
    types: [completed]
    branches: [main]
  # By hand, from Actions > refine > Run workflow (Invoke-LocalIngest.ps1 starts one this way).
  workflow_dispatch:
    inputs:
      skip_link_check:
        description: Skip the link check (known link results still apply).
        type: boolean
        required: false
        default: false
      skip_city_lookup:
        description: Skip the city lookup for Other events (known cities still apply).
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

# Shared with ingest, so the two never run at once. A manual refine waits for a running ingest.
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  nightly:
    # A manual ingest runs alone; only the scheduled one is followed by refine.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule'
    uses: rhundhausen/weekend/.github/workflows/refine.yml@main
    with:
      skip_link_check: ${{ inputs.skip_link_check || false }}
      skip_city_lookup: ${{ inputs.skip_city_lookup || false }}
    secrets: inherit
